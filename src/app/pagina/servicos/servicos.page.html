<app-header [showAdminButton]="true" [showMenuButton]="true" (adminClick)="openAdmin()"></app-header>

<ion-content [fullscreen]="true" class="cat-bg">
  <!-- Filtro categorias -->
  <div class="cat-filtro" *ngIf="categorias.length">
    <ion-chip *ngFor="let c of categorias" [class.active]="catSelecionada === c" (click)="filtrar(c)">
      {{ c }}
    </ion-chip>
    <ion-chip [class.active]="catSelecionada === 'Todos'" (click)="filtrar('Todos')">Todos</ion-chip>
  </div>

  <ion-grid>
    <ion-row>
      <ion-col size="6" sizeMd="4" *ngFor="let p of produtos">
        <ion-card class="prod-card">
          <div class="prod-img" [style.backgroundImage]="'url(' + (p.imagem || p.img) + ')'"></div>
          <ion-card-content>
            <ion-label class="prod-cat">{{ p.categoria }}</ion-label>
            <ion-card-title class="prod-nome">{{ p.nome }}</ion-card-title>
            <div class="prod-rodape">
              <span class="prod-preco">R$ {{ p.preco.toFixed(2) }}</span>
              <ion-button *ngIf="!semEstoque(p)" fill="clear" color="tertiary" size="small" (click)="add(p)">
                <ion-icon name="add-circle" slot="icon-only"></ion-icon>
              </ion-button>
              <ion-badge *ngIf="semEstoque(p)" color="danger" class="sem-estoque-badge">Indisponível</ion-badge>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
    <div *ngIf="!produtos.length" class="ion-text-center ion-padding">
      <p>Nenhum produto encontrado</p>
    </div>
  </ion-grid>

  <div class="disponibilidade-bar">
    <p>* Consulte disponibilidade. Produtos sujeitos a falta de estoque.</p>
  </div>
</ion-content>

<!-- Carrinho Preview -->
<div class="cart-preview" *ngIf="cartQtd > 0" (click)="openPage('/agende')">
  <div class="cart-preview-info">
    <ion-icon name="cart-outline"></ion-icon>
    <span class="cart-count">{{ cartQtd }} {{ cartQtd === 1 ? 'item' : 'itens' }}</span>
  </div>
  <div class="cart-preview-total">
    <span>Total previsto: <strong>R$ {{ cartTotal.toFixed(2) }}</strong></span>
    <ion-icon name="chevron-forward-outline"></ion-icon>
  </div>
</div>

<app-bottom-nav [activeUrl]="'/servicos'"></app-bottom-nav>
