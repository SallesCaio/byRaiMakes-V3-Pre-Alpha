<ion-header>
  <ion-toolbar class="raimake-bar">
    <ion-buttons slot="start">
      <ion-menu-button auto-hide="false"></ion-menu-button>
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <div class="header-brand">
        <img src="assets/img/logo.png" class="logo-home" alt="byRaiMakes">
        <div class="header-brand-text">
          <span class="brand-name"><span class="brand-pink">byRai</span><span class="brand-gold">Make</span></span>
          <span class="header-tagline">SUA BELEZA. SEU GLOW.</span>
        </div>
      </div>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="stats-grid">
    <ion-card class="stat-card" *ngFor="let s of stats">
      <ion-card-content class="ion-text-center">
        <ion-icon [name]="s.icon" class="stat-icon"></ion-icon>
        <h2>{{ s.value }}</h2>
        <p>{{ s.label }}</p>
      </ion-card-content>
    </ion-card>
  </div>

  <ion-list class="ion-margin-top">
    <ion-list-header>
      <ion-label><strong>Ações Rápidas</strong></ion-label>
    </ion-list-header>
    <ion-item button routerLink="/admin/produto-form">
      <ion-icon name="add-circle" slot="start" color="primary"></ion-icon>
      <ion-label>Novo Produto</ion-label>
    </ion-item>
    <ion-item button routerLink="/admin/produtos">
      <ion-icon name="list" slot="start" color="secondary"></ion-icon>
      <ion-label>Gerenciar Produtos</ion-label>
    </ion-item>
    <ion-item button routerLink="/home">
      <ion-icon name="home-outline" slot="start" color="medium"></ion-icon>
      <ion-label>Ir para Home</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
