<ion-header>
  <ion-toolbar class="raimake-bar" style="--min-height: 60px;">
    <ion-buttons slot="start">
      <ion-menu-button auto-hide="false"></ion-menu-button>
    </ion-buttons>
    <ion-title>
      <div class="header-brand">
        <img src="assets/img/logo.png" class="logo-home" alt="byRaiMakes">
        <div class="header-brand-text">
          <span class="brand-name"><span class="brand-pink">byRai</span><span class="brand-gold">Makes</span></span>
          <span class="header-tagline">SUA BELEZA. SEU GLOW.</span>
        </div>
      </div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="admin-login-container">
    <div class="admin-logo">
      <h1>byRai<span>Makes</span></h1>
      <p>Painel Administrativo</p>
    </div>

    <ion-card *ngIf="erro" class="ion-padding" color="danger">
      <ion-text color="light">{{ erro }}</ion-text>
    </ion-card>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <ion-item class="login-input-item">
        <ion-label position="stacked">E-mail</ion-label>
        <ion-input type="email" formControlName="email" placeholder="admin@byraimake.com"></ion-input>
      </ion-item>

      <ion-item class="login-input-item ion-margin-top">
        <ion-label position="stacked">Senha</ion-label>
        <ion-input type="password" formControlName="senha"></ion-input>
      </ion-item>

      <ion-button type="submit" expand="block" class="ion-margin-top" [disabled]="loginForm.invalid || loading">
        <ion-icon name="lock-closed" slot="start"></ion-icon>
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </ion-button>
    </form>
  </div>
</ion-content>
